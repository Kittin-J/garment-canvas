<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Garment Canvas · 服装设计协同工作台</title>
    <script>
      (() => {
        let shown = false;
        const showVersionRecovery = () => {
          if (shown) return;
          shown = true;
          const render = () => {
            const root = document.getElementById("root");
            if (!root) return;
            const panel = document.createElement("main");
            panel.id = "garment-canvas-version-recovery";
            panel.style.cssText = "min-height:100vh;display:grid;place-items:center;padding:24px;background:#101214;color:#e5e7eb;font-family:system-ui,sans-serif";
            const card = document.createElement("section");
            card.style.cssText = "max-width:420px;padding:24px;border:1px solid #34363a;border-radius:14px;background:#17191c;box-shadow:0 20px 60px rgba(0,0,0,.35)";
            const title = document.createElement("h1");
            title.textContent = "检测到新版本";
            title.style.cssText = "margin:0 0 10px;font-size:20px";
            const message = document.createElement("p");
            message.textContent = "页面资源已经更新，请刷新后继续。服务器保存的项目和素材不会受到影响。";
            message.style.cssText = "margin:0 0 18px;color:#a3a3a3;font-size:14px;line-height:1.7";
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = "刷新页面";
            button.style.cssText = "border:0;border-radius:8px;padding:10px 16px;background:#9A7333;color:white;cursor:pointer";
            button.addEventListener("click", () => window.location.reload());
            card.append(title, message, button);
            panel.append(card);
            root.replaceChildren(panel);
          };
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render, { once: true });
          else render();
        };
        window.addEventListener("error", (event) => {
          const target = event.target;
          const source = target instanceof HTMLScriptElement
            ? target.src
            : target instanceof HTMLLinkElement && target.rel === "stylesheet" ? target.href : "";
          if (source && new URL(source, window.location.href).pathname.startsWith("/assets/")) {
            showVersionRecovery();
          }
        }, true);
        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          showVersionRecovery();
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-Dcvu2qQ_.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DeSm-UGG.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
