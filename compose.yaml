name: garment-canvas

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garment_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-garment_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在私有 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: garment-canvas:local
    container_name: garment-canvas
    restart: unless-stopped
    env_file:
      - path: ${GARMENT_CANVAS_ENV_FILE:-.env}
        required: true
    environment:
      NODE_ENV: production
      PORT: 3002
      DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-garment_canvas}
      PGUSER: ${POSTGRES_USER:-garment_canvas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在私有 .env 中设置 POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GARMENT_CANVAS_PORT:-3001}:3002"
    volumes:
      - type: bind
        source: ${GARMENT_CANVAS_DATA_DIR:-./.docker-data}
        target: /app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${GARMENT_CANVAS_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx/garment-canvas.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
